<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
{{ collection:pages as="pages" }}{{ pages }}{{ unless no_index }}
    <url>
        <loc>{{ permalink }}</loc>
        <lastmod>{{ updated_at format="Y-m-d" }}</lastmod>
    </url>
{{ /unless }}{{ /pages }}{{ /collection:pages }}
</urlset>
