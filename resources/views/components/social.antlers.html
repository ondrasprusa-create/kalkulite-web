{{# Ikona sociální sítě. Parametry: href, label, icon (SVG path d, viewBox 24) #}}
<li>
    <a href="{{ href }}" target="_blank" rel="noopener" aria-label="{{ label }}" class="grid size-11 place-items-center rounded-xl border border-white/10 bg-white/5 text-slate-300 transition-all duration-300 hover:-translate-y-1 hover:border-transparent hover:bg-brand-gradient hover:text-white hover:shadow-glow">
        <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{ icon }}"/></svg>
    </a>
</li>
