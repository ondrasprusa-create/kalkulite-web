{{# Ikona sociální sítě. Parametry: href, label, icon (SVG path d, viewBox 24), size (sm|md) #}}
<li>
    <a href="{{ href }}" target="_blank" rel="noopener" aria-label="KALKULite na {{ label }}" class="grid {{ size == 'sm' ? 'size-10 rounded-xl' : 'size-11 rounded-xl' }} place-items-center border border-white/10 bg-white/5 text-slate-300 transition-all duration-300 hover:-translate-y-0.5 hover:border-transparent hover:bg-brand-gradient hover:text-white hover:shadow-glow">
        <svg class="{{ size == 'sm' ? 'size-3.5' : 'size-4' }}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{ icon }}"/></svg>
    </a>
</li>
