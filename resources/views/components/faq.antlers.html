{{# FAQ – časté otázky z pole `faq` (zároveň se vypisují jako JSON-LD FAQPage v seo/schema) #}}
{{ if faq }}
<section id="faq" class="relative py-20 sm:py-28">
    <div class="mx-auto max-w-3xl px-4 sm:px-6 lg:px-8">
        {{ partial:components/section-heading }}
            Časté otázky
        {{ /partial:components/section-heading }}

        <div class="mt-12 divide-y divide-white/10 rounded-3xl border border-white/10 bg-white/5 backdrop-blur-md" data-reveal>
            {{ faq }}
                <details name="faq" class="group px-5 sm:px-7" {{ if first }}open{{ /if }}>
                    <summary class="flex cursor-pointer list-none items-center justify-between gap-6 py-5 [&::-webkit-details-marker]:hidden">
                        <h3 class="text-lg transition-colors group-hover:text-white">{{ question }}</h3>
                        <span class="grid size-8 shrink-0 place-items-center rounded-full border border-white/10 text-slate-400 transition-transform duration-300 group-open:rotate-45 group-open:border-white/30 group-open:text-white" aria-hidden="true">
                            <svg class="size-4" viewBox="0 0 20 20" fill="currentColor"><path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"/></svg>
                        </span>
                    </summary>
                    <p class="-mt-1 pb-6 text-slate-300">{{ answer }}</p>
                </details>
            {{ /faq }}
        </div>
    </div>
</section>
{{ /if }}
