{{# Krok v sekci „Jak to funguje“. Parametry: number, title, text #}}
<li class="relative flex gap-5 md:block md:text-center">
    <span class="relative z-10 grid size-12 shrink-0 place-items-center rounded-full border border-white/15 bg-brand-dark font-chakra text-lg font-bold text-white shadow-glow md:mx-auto">
        {{ number }}
    </span>
    <div class="md:mt-6">
        <h3 class="text-xl font-semibold text-balance">{{ title }}</h3>
        <p class="mt-2 text-pretty text-muted md:mx-auto md:max-w-xs">{{ text }}</p>
    </div>
</li>
