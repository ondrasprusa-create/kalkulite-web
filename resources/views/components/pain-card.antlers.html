{{# Karta bolesti. Parametry: title, text, icon (SVG path d), delay (ms) #}}
<li data-reveal style="--reveal-delay: {{ delay ?? 0 }}ms" class="group relative rounded-2xl border border-white/10 bg-white/5 p-6 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-brand-teal/50 hover:bg-white/[0.08]">
    <span class="grid size-12 place-items-center rounded-xl border border-white/10 bg-brand-dark/60 text-slate-300 transition-all duration-300 group-hover:animate-wiggle group-hover:border-brand-teal/50 group-hover:text-brand-teal">
        <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ icon }}"/></svg>
    </span>
    <h3 class="mt-5 text-lg font-semibold">{{ title }}</h3>
    <p class="mt-2 text-sm text-slate-400">{{ text }}</p>
</li>
