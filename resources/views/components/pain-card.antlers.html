{{# Bolest řemeslníka – položka seznamu (bez karty). Parametry: title, text, icon (SVG path d) #}}
<li class="border-t border-white/10 pt-5">
    <h3 class="flex items-center gap-2.5 text-lg font-semibold">
        <svg class="size-5 shrink-0 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ icon }}"/></svg>
        {{ title }}
    </h3>
    <p class="mt-2 text-sm text-pretty text-muted">{{ text }}</p>
</li>
