tabs:
  main:
    display: Main
    sections:
      -
        display: Kontakt
        fields:
          -
            handle: app_url
            field: { type: text, input_type: url, display: 'URL webové aplikace', instructions: 'Kam vedou všechna tlačítka „Vyzkoušet zdarma“.' }
          -
            handle: contact_email
            field: { type: text, input_type: email, display: 'Kontaktní e-mail' }
      -
        display: 'Sociální sítě'
        fields:
          -
            handle: social_instagram
            field: { type: text, input_type: url, display: Instagram, width: 50 }
          -
            handle: social_tiktok
            field: { type: text, input_type: url, display: TikTok, width: 50 }
          -
            handle: social_facebook
            field: { type: text, input_type: url, display: Facebook, width: 50 }
          -
            handle: social_linkedin
            field: { type: text, input_type: url, display: LinkedIn, width: 50 }
      -
        display: 'Provozovatel (pro zásady ochrany osobních údajů)'
        fields:
          -
            handle: operator_name
            field: { type: text, display: 'Jméno / název provozovatele', instructions: 'Fyzická osoba (OSVČ) nebo firma, která je správcem osobních údajů.', width: 50 }
          -
            handle: operator_id
            field: { type: text, display: IČO, width: 50 }
          -
            handle: operator_address
            field: { type: text, display: 'Sídlo / adresa' }
